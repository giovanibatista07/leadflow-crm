name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leadflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/leadflow?sslmode=disable
      DIRECT_URL: postgres://postgres:postgres@localhost:5432/leadflow?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - name: Apply database migrations
        run: npx prisma migrate deploy

      # The RLS tests exercise Supabase's `auth.uid()` / `authenticated` role
      # mechanics directly, so this CI job emulates them the same way local
      # dev does: /supabase/migrations is unmodified from what ships to
      # Supabase; the shim below exists only here and under tests/rls.
      - name: Apply RLS policies (and the local-only Supabase auth shim)
        run: |
          npx prisma db execute --file tests/rls/local-supabase-shim.sql --url "$DATABASE_URL"
          npx prisma db execute --file supabase/migrations/0001_rls_helper_functions.sql --url "$DATABASE_URL"
          npx prisma db execute --file supabase/migrations/0002_enable_rls.sql --url "$DATABASE_URL"
          npx prisma db execute --file supabase/migrations/0003_rls_policies.sql --url "$DATABASE_URL"

      - run: npm test

      - run: npm run build
