name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leadflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/leadflow?sslmode=disable
      DIRECT_URL: postgres://postgres:postgres@localhost:5432/leadflow?sslmode=disable
      # Fake but validly-shaped values so build/typecheck don't need a real
      # Supabase project. Never real secrets -- just enough for the code
      # paths that read these at build/import time to not blow up.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - name: Apply database migrations
        run: npx prisma migrate deploy

      # The RLS tests exercise Supabase's `auth.uid()` / `authenticated` role
      # mechanics directly, so this CI job emulates them the same way local
      # dev does: /supabase/migrations is unmodified from what ships to
      # Supabase; the shim below exists only here and under tests/rls.
      #
      # Applies every file in /supabase/migrations, in filename order, not
      # a hardcoded list -- a hardcoded list silently stops testing RLS for
      # any table added after it was written, which is exactly what let
      # invites and import_mappings go unenforced here for two whole steps
      # until new tests for them caught it.
      - name: Apply RLS policies (and the local-only Supabase auth shim)
        run: |
          npx prisma db execute --file tests/rls/local-supabase-shim.sql --url "$DATABASE_URL"
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            npx prisma db execute --file "$f" --url "$DATABASE_URL"
          done

      - run: npm test

      - run: npm run build
